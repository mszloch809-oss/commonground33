    const RTDB = "https://commonground-71e64-default-rtdb.firebaseio.com";
    window.__fb_ready = false;
    window.db = {
      _write: async (key, val) => {
        try {
          const res = await fetch(`${RTDB}/cg/${key}.json`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({v: JSON.stringify(val), t: Date.now()})
          });
          return res.ok;
        } catch(e) { return false; }
      },
      _read: async (key) => {
        try {
          const res = await fetch(`${RTDB}/cg/${key}.json`);
          if(!res.ok) return null;
          const data = await res.json();
          return data;
        } catch(e) { return null; }
      }
    };
    // Test connection
    fetch(`${RTDB}/cg/__ping__.json`, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({t: Date.now()})
    }).then(r => {
      window.__fb_ready = r.ok;
      console.log('RTDB:', r.ok ? 'Connected!' : 'Failed - '+r.status);
    }).catch(e => console.error('RTDB error:', e.message));

    function PayRent({unit,tenant}){
      const unitRent = getRent(unit);
      const unitType = getType(unit);

      // Each charge: {on: bool, amt: number}
      const initCharges = () => ({
        rent:    {on:true,  amt:unitRent},
        parking: {on:false, amt:75},
        pet:     {on:false, amt:50},
        fine:    {on:false, amt:0},
        partial: {on:false, amt:0},
      });

      const [ch, setCh] = useState(initCharges);
      const [note, setNote] = useState("");

      const toggle = (id) => setCh(prev => ({...prev, [id]:{...prev[id], on:!prev[id].on}}));
      const setAmt = (id, val) => setCh(prev => ({...prev, [id]:{...prev[id], amt:parseFloat(val)||0}}));
      const reset  = () => { setCh(initCharges()); setNote(""); };

      const total = CHARGES_CONFIG.reduce((s,c) => ch[c.id].on ? s + (ch[c.id].amt||0) : s, 0);
      const activeCount = CHARGES_CONFIG.filter(c => ch[c.id].on).length;

      const handlePay = () => {
        if(total===0) return;
        const now = new Date();
        const dateStr  = now.toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"});
        const monthStr = now.toLocaleDateString("en-US",{month:"long",year:"numeric"});
        const existing = loadData("cg_payments_"+unit,[]);
        const record = {
          date:dateStr, desc:"Payment – "+monthStr,
          total, method:"Stripe", status:"processing",
          charges: CHARGES_CONFIG.filter(c=>ch[c.id].on).map(c=>({label:c.label,amt:ch[c.id].amt})),
          note
        };
        saveData("cg_payments_"+unit,[...existing,record]);
        window.open("https://buy.stripe.com/3cIcN6euJbfJbzR2Rz7EQ00","_blank");
      };

      return(
        <div style={{display:"flex",flexDirection:"column",gap:16}}>
          <div style={{fontFamily:T.serif,fontSize:24,fontWeight:900,color:T.text}}>Pay Rent</div>

          {/* Stripe badge */}
          <div style={{padding:"12px 16px",borderRadius:12,background:T.greenDim,border:`1px solid ${T.green}33`,display:"flex",alignItems:"center",gap:10}}>
            <span style={{fontSize:18}}>🔒</span>
            <div>
              <div style={{fontSize:13,fontWeight:700,color:T.green}}>Secured by Stripe</div>
              <div style={{fontSize:11,color:T.muted}}>Payments go directly to Upside Real Estate Development</div>
            </div>
          </div>

          {/* Charges card */}
          <Card>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
              <div style={{fontSize:11,color:T.muted,fontWeight:700,letterSpacing:"0.1em"}}>SELECT CHARGES</div>
              <button onClick={reset} style={{background:"none",border:"none",color:T.muted,fontSize:11,cursor:"pointer",textDecoration:"underline"}}>Reset</button>
            </div>
            <div style={{fontSize:12,color:T.green,fontWeight:600,marginBottom:14}}>Unit {unit} · {unitType}</div>

            {CHARGES_CONFIG.map(c => {
              const active = ch[c.id].on;
              return (
                <div key={c.id} style={{marginBottom:10}}>
                  {/* Toggle row */}
                  <div
                    onClick={() => toggle(c.id)}
                    style={{display:"flex",alignItems:"center",gap:12,padding:"12px 14px",borderRadius:12,
                      border:`1.5px solid ${active ? c.color+"66" : T.border}`,
                      background: active ? c.color+"12" : T.surface,
                      cursor:"pointer",transition:"all 0.15s",marginBottom:active?6:0}}
                  >
                    {/* Checkbox circle */}
                    <div style={{width:22,height:22,borderRadius:"50%",flexShrink:0,
                      border:`2px solid ${active ? c.color : T.border}`,
                      background: active ? c.color : "transparent",
                      display:"flex",alignItems:"center",justifyContent:"center",transition:"all 0.15s"}}>
                      {active && <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#071a0e" strokeWidth="3" strokeLinecap="round"><path d="M20 6L9 17l-5-5"/></svg>}
                    </div>
                    <div style={{flex:1}}>
                      <div style={{fontSize:14,fontWeight:700,color:active?T.text:T.muted}}>{c.label}</div>
                      {!active && <div style={{fontSize:11,color:T.muted}}>Tap to include</div>}
                    </div>
                    {active && <div style={{fontFamily:T.serif,fontSize:15,fontWeight:900,color:c.color}}>${(ch[c.id].amt||0).toLocaleString()}</div>}
                  </div>

                  {/* Amount input when active */}
                  {active && (
                    <div style={{display:"flex",alignItems:"center",gap:10,padding:"2px 6px 0"}}>
                      <div style={{fontSize:12,color:T.muted,whiteSpace:"nowrap",minWidth:70}}>Amount</div>
                      <div style={{position:"relative",flex:1}}>
                        <span style={{position:"absolute",left:11,top:"50%",transform:"translateY(-50%)",color:c.color,fontWeight:800}}>$</span>
                        <input
                          type="number"
                          value={ch[c.id].amt}
                          onChange={e => setAmt(c.id, e.target.value)}
                          style={{width:"100%",background:T.surface,border:`1px solid ${c.color}55`,borderRadius:10,
                            padding:"9px 12px 9px 24px",color:T.text,fontSize:15,fontFamily:T.serif,
                            fontWeight:800,outline:"none",boxSizing:"border-box"}}
                        />
                      </div>
                    </div>
                  )}
                </div>
              );
            })}

            {/* Total */}
            <div style={{borderTop:`1px solid ${T.border}`,marginTop:8,paddingTop:14,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{fontSize:11,color:T.muted,fontWeight:700,letterSpacing:"0.1em"}}>TOTAL</div>
                <div style={{fontSize:11,color:T.muted,marginTop:2}}>{activeCount} {activeCount===1?"charge":"charges"} selected</div>
              </div>
              <div style={{fontFamily:T.serif,fontSize:32,fontWeight:900,color:total>0?T.green:T.muted}}>
                ${total.toLocaleString()}
              </div>
            </div>
          </Card>

          {/* Note */}
          <Input value={note} onChange={setNote} placeholder="Note to manager (optional)"/>

          {/* Payment methods info */}
          <Card style={{padding:16}}>
            <div style={{fontSize:11,color:T.muted,fontWeight:700,letterSpacing:"0.1em",marginBottom:10}}>ACCEPTED PAYMENT METHODS</div>
            {[["💳","Credit / Debit Card","Visa, Mastercard, Amex — Instant"],
              ["🏦","ACH Bank Transfer","Free — 2-3 business days"],
              ["🍎","Apple Pay / Google Pay","Tap to pay instantly"]].map(([icon,label,sub])=>(
              <div key={label} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 0",borderBottom:`1px solid ${T.border}`}}>
                <span style={{fontSize:18}}>{icon}</span>
                <div style={{flex:1}}>
                  <div style={{fontSize:13,fontWeight:600,color:T.text}}>{label}</div>
                  <div style={{fontSize:11,color:T.muted}}>{sub}</div>
                </div>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={T.green} strokeWidth="2.5" strokeLinecap="round"><path d="M20 6L9 17l-5-5"/></svg>
              </div>
            ))}
          </Card>

          {/* Pay button */}
          <button
            onClick={handlePay}
            disabled={total===0}
            style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8,width:"100%",
              padding:"16px",borderRadius:12,border:"none",
              background:total===0?"#2A3F30":`linear-gradient(135deg,${T.green},#2aaa72)`,
              color:total===0?T.muted:"#071a0e",fontSize:16,fontWeight:800,
              cursor:total===0?"not-allowed":"pointer",
              boxShadow:total>0?`0 4px 20px ${T.greenGlow}`:"none",
              transition:"all 0.18s",opacity:total===0?0.5:1}}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            {total===0 ? "Select charges above" : `Pay $${total.toLocaleString()} via Stripe`}
          </button>

          <div style={{textAlign:"center",fontSize:11,color:T.muted,lineHeight:1.7}}>
            Tapping Pay opens Stripe's secure checkout page.<br/>
            Choose your payment method there and complete payment.<br/>
            Stripe sends you an email receipt automatically.
          </div>
        </div>
      );
    }

      const [msgs,setMsgs]=useState(()=>loadData("cg_msgs_"+unit,initMsgs));

      useEffect(()=>{bottomRef.current?.scrollIntoView({behavior:"smooth"});},[msgs]);
      // Real-time Firebase sync for messages
      useEffect(()=>{
        syncFromCloud("cg_msgs_"+unit,initMsgs,(cloudMsgs)=>{if(cloudMsgs&&cloudMsgs.length>0)setMsgs(cloudMsgs);});
        const unsub=listenCloud("cg_msgs_"+unit,(cloudMsgs)=>{if(cloudMsgs&&cloudMsgs.length>0)setMsgs(cloudMsgs);});
        return()=>unsub();
      },[unit]);
      const send=()=>{
        if(!input.trim())return;
        const now=new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});

    function Forum({tenant,unit,isManager=false}){
      const [forums,setForums]=useState(()=>loadData("cg_forum",INIT_FORUMS));
      const [view,setView]=useState(null);
      const [showNew,setShowNew]=useState(false);
      const [newTitle,setNewTitle]=useState("");
      const [newBody,setNewBody]=useState("");
      const [reply,setReply]=useState("");
      // Real-time Firebase sync for forum — all tenants see same posts
      useEffect(()=>{
        syncFromCloud("cg_forum",INIT_FORUMS,(cloudForum)=>{if(cloudForum&&cloudForum.length>0)setForums(cloudForum);});
        const unsub=listenCloud("cg_forum",(cloudForum)=>{if(cloudForum&&cloudForum.length>0)setForums(cloudForum);});
        return()=>unsub();
      },[]);
      const saveForums=(f)=>{setForums(f);saveData("cg_forum",f);};
      const post=forums.find(p=>p.id===view);
      const addPost=()=>{
        if(!newTitle.trim()||!newBody.trim())return;
        const a=isManager?`${MANAGER.name} (Manager)`:`${tenant.firstName} ${tenant.lastName[0]}.`;
        const updated=[{id:Date.now(),author:a,unit:isManager?"MGR":unit,time:"Just now",title:newTitle,body:newBody,replies:[],likes:0,isManager},...forums];
        saveForums(updated);
        setNewTitle("");setNewBody("");setShowNew(false);
      };
      const addReply=()=>{
        if(!reply.trim())return;
        const a=isManager?`${MANAGER.name} (Manager)`:`${tenant.firstName} ${tenant.lastName[0]}.`;
        const updated=forums.map(p=>p.id===view?{...p,replies:[...p.replies,{author:a,unit:isManager?"MGR":unit,text:reply,time:"Just now",isManager}]}:p);
        saveForums(updated);
        setReply("");
      };
      const [confirmDelete,setConfirmDelete]=useState(null); // {type,id,replyIdx}
      const deletePost=(id)=>setConfirmDelete({type:"post",id});
      const deleteReply=(postId,replyIdx)=>setConfirmDelete({type:"reply",id:postId,replyIdx});
      const confirmAction=()=>{

    // ── DATA LAYER — localStorage + Firestore REST API ──────────────────
    const loadData=(key,fallback)=>{try{const v=localStorage.getItem(key);return v?JSON.parse(v):fallback;}catch(e){return fallback;}};

    const saveData=(key,val)=>{
      try{localStorage.setItem(key,JSON.stringify(val));}catch(e){}
      if(window.db){
        window.db._write(key,val)
          .then(ok=>console.log(ok?"Cloud saved:":"Cloud FAILED:",key));
      }
    };

    const syncFromCloud=(key,fallback,setter)=>{
      if(!window.db)return;
      window.db._read(key).then(data=>{
        if(data&&data.v){
          try{
            const val=JSON.parse(data.v);
            localStorage.setItem(key,JSON.stringify(val));
            if(setter)setter(val);
          }catch(e){}
        }
      });
    };

    const listenCloud=(key,setter)=>{
      if(!window.db)return()=>{};
      let lastT=0;
      const poll=()=>{
        window.db._read(key).then(data=>{
          if(data&&data.v&&data.t!==lastT){
            lastT=data.t;
            try{
              const val=JSON.parse(data.v);
              localStorage.setItem(key,JSON.stringify(val));
              setter(val);
            }catch(e){}
          }
        });
      };
      poll();
      const iv=setInterval(poll,4000);
      return()=>clearInterval(iv);
    };

    function PinScreen({unit,onSuccess,onBack}){

        const next=pin+d;

          if(next===correct){onSuccess();}
          else{setError(true);setShake(true);setTimeout(()=>{setPin("");setError(false);setShake(false);},700);}
        }
      };
      const del=()=>setPin(p=>p.slice(0,-1));
      return(
        <div style={{minHeight:"100vh",background:T.bg,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24}}>

      const [signing,setSigning]=useState(false);
      const [hasDrawn,setHasDrawn]=useState(false);
      const canvasRef=useRef();
      const drawing=useRef(false);
      const startDraw=(e)=>{drawing.current=true;const c=canvasRef.current;const ctx=c.getContext("2d");const r=c.getBoundingClientRect();const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;const y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;ctx.beginPath();ctx.moveTo(x,y);};
      const draw=(e)=>{if(!drawing.current)return;e.preventDefault();const c=canvasRef.current;const ctx=c.getContext("2d");const r=c.getBoundingClientRect();const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;const y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;ctx.lineTo(x,y);ctx.strokeStyle=T.green;ctx.lineWidth=2.5;ctx.lineCap="round";ctx.stroke();setHasDrawn(true);};
      const stopDraw=()=>{drawing.current=false;};
      const clearSig=()=>{canvasRef.current.getContext("2d").clearRect(0,0,canvasRef.current.width,canvasRef.current.height);setHasDrawn(false);};

    function LedgerTab(){
      const CATS=[
        {id:"rent",label:"Rent",color:"#3EC98E",type:"income"},
        {id:"repair",label:"Repairs",color:"#F76F6F",type:"expense"},
        {id:"utility",label:"Utilities",color:"#F5C542",type:"expense"},
        {id:"tax",label:"Property Tax",color:"#A78BFA",type:"expense"},
        {id:"insurance",label:"Insurance",color:"#5B9CF6",type:"expense"},
        {id:"landscaping",label:"Landscaping",color:"#7BCFB8",type:"expense"},
        {id:"snow",label:"Snow Removal",color:"#A8D5B5",type:"expense"},
        {id:"other",label:"Other",color:"#6A8070",type:"expense"},
      ];
      const [entries,setEntries]=useState(()=>loadData("cg_ledger",[]));
      const [showAdd,setShowAdd]=useState(false);
      const [form,setForm]=useState({date:"",desc:"",amount:"",cat:"rent",unit:"",type:"income",note:""});
      const [filter,setFilter]=useState("all");
      const upd=k=>e=>setForm(f=>({...f,[k]:e.target.value}));

      const save=()=>{
        if(!form.date||!form.desc||!form.amount)return;
        const cat=CATS.find(c=>c.id===form.cat);
        const entry={
          id:Date.now(),date:form.date,desc:form.desc,
          amount:parseFloat(form.amount),cat:form.cat,
          catLabel:cat?.label||form.cat,color:cat?.color||T.muted,
          unit:form.unit,type:cat?.type||form.type,note:form.note
        };
        const updated=[entry,...entries];
        setEntries(updated);
        saveData("cg_ledger",updated);
        setForm({date:"",desc:"",amount:"",cat:"rent",unit:"",type:"income",note:""});
        setShowAdd(false);
      };

      const del=id=>{
        const updated=entries.filter(e=>e.id!==id);
        setEntries(updated);
        saveData("cg_ledger",updated);
      };

      const filtered=filter==="all"?entries:entries.filter(e=>e.type===filter);
      const totalIncome=entries.filter(e=>e.type==="income").reduce((s,e)=>s+e.amount,0);
      const totalExpense=entries.filter(e=>e.type==="expense").reduce((s,e)=>s+e.amount,0);
      const net=totalIncome-totalExpense;

      const inp={width:"100%",background:T.surface,border:"1px solid "+T.border,borderRadius:10,padding:"9px 12px",color:T.text,fontSize:13,outline:"none",boxSizing:"border-box"};
      const sel={...inp,appearance:"none"};

      return(
        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{fontFamily:T.serif,fontSize:22,fontWeight:900,color:T.text}}>Ledger</div>
            <button onClick={()=>setShowAdd(!showAdd)} style={{background:`linear-gradient(135deg,${T.green},#2aaa72)`,border:"none",borderRadius:10,padding:"8px 16px",color:"#071a0e",fontWeight:700,fontSize:13,cursor:"pointer"}}>+ Add Entry</button>
          </div>

          {/* Summary */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
            {[["Income","$"+totalIncome.toLocaleString(),T.green],["Expenses","$"+totalExpense.toLocaleString(),T.red],["Net","$"+Math.abs(net).toLocaleString()+(net<0?" (loss)":""),net>=0?T.green:T.red]].map(([l,v,c])=>(
              <Card key={l} style={{padding:12,textAlign:"center"}}>
                <div style={{fontSize:10,color:T.muted,fontWeight:700,letterSpacing:"0.1em",marginBottom:4}}>{l.toUpperCase()}</div>
                <div style={{fontSize:16,fontWeight:900,color:c,fontFamily:T.serif}}>{v}</div>
              </Card>
            ))}
          </div>

          {/* Add entry form */}
          {showAdd&&(
            <Card style={{border:`1px solid ${T.green}44`}}>
              <div style={{fontSize:11,color:T.green,fontWeight:700,letterSpacing:"0.1em",marginBottom:14}}>NEW ENTRY</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
                <div><div style={{fontSize:11,color:T.muted,marginBottom:4}}>Date *</div><input type="date" value={form.date} onChange={upd("date")} style={inp}/></div>
                <div><div style={{fontSize:11,color:T.muted,marginBottom:4}}>Category *</div>
                  <select value={form.cat} onChange={e=>{const c=CATS.find(x=>x.id===e.target.value);setForm(f=>({...f,cat:e.target.value,type:c?.type||"expense"}));}} style={sel}>
                    {CATS.map(c=><option key={c.id} value={c.id}>{c.label}</option>)}
                  </select>
                </div>
              </div>
              <div style={{marginBottom:10}}><div style={{fontSize:11,color:T.muted,marginBottom:4}}>Description *</div><input value={form.desc} onChange={upd("desc")} placeholder="e.g. April rent Unit 101" style={inp}/></div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
                <div><div style={{fontSize:11,color:T.muted,marginBottom:4}}>Amount ($) *</div><input type="number" value={form.amount} onChange={upd("amount")} placeholder="0.00" style={inp}/></div>
                <div><div style={{fontSize:11,color:T.muted,marginBottom:4}}>Unit</div>
                  <select value={form.unit} onChange={upd("unit")} style={sel}>
                    <option value="">All / Building</option>
                    {["101","102","201","202","301","302","303"].map(u=><option key={u} value={u}>Unit {u}</option>)}
                  </select>
                </div>
              </div>
              <div style={{marginBottom:14}}><div style={{fontSize:11,color:T.muted,marginBottom:4}}>Note</div><input value={form.note} onChange={upd("note")} placeholder="Optional note" style={inp}/></div>
              <div style={{display:"flex",gap:8}}>
                <button onClick={()=>setShowAdd(false)} style={{flex:1,padding:"10px",borderRadius:10,border:"1px solid "+T.border,background:"transparent",color:T.muted,fontSize:13,fontWeight:700,cursor:"pointer"}}>Cancel</button>
                <button onClick={save} disabled={!form.date||!form.desc||!form.amount} style={{flex:2,padding:"10px",borderRadius:10,border:"none",background:!form.date||!form.desc||!form.amount?"#2A3F30":`linear-gradient(135deg,${T.green},#2aaa72)`,color:!form.date||!form.desc||!form.amount?T.muted:"#071a0e",fontSize:13,fontWeight:800,cursor:"pointer"}}>Save Entry</button>
              </div>
            </Card>
          )}

          {/* Filter */}
          <div style={{display:"flex",gap:8}}>
            {[["all","All"],["income","Income"],["expense","Expenses"]].map(([v,l])=>(
              <button key={v} onClick={()=>setFilter(v)} style={{padding:"6px 14px",borderRadius:20,border:"1px solid "+(filter===v?T.green:T.border),background:filter===v?T.greenDim:"transparent",color:filter===v?T.green:T.muted,fontSize:12,fontWeight:700,cursor:"pointer"}}>{l}</button>
            ))}
            <span style={{marginLeft:"auto",fontSize:11,color:T.muted,alignSelf:"center"}}>{filtered.length} entries</span>
          </div>

          {/* Entries */}
          {filtered.length===0?(
            <Card><div style={{textAlign:"center",padding:"24px 0",color:T.muted,fontSize:13}}>No entries yet. Tap + Add Entry to get started.</div></Card>
          ):(
            <Card style={{padding:0}}>
              {filtered.map((e,i)=>(
                <div key={e.id} style={{display:"flex",alignItems:"center",gap:12,padding:"13px 16px",borderBottom:i<filtered.length-1?"1px solid "+T.border:"none"}}>
                  <div style={{width:10,height:10,borderRadius:"50%",background:e.color,flexShrink:0}}/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,fontWeight:600,color:T.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{e.desc}</div>
                    <div style={{fontSize:11,color:T.muted}}>{e.date} · {e.catLabel}{e.unit?" · Unit "+e.unit:""}{e.note?" · "+e.note:""}</div>
                  </div>
                  <div style={{textAlign:"right",flexShrink:0}}>
                    <div style={{fontSize:14,fontWeight:800,color:e.type==="income"?T.green:T.red,fontFamily:T.serif}}>{e.type==="income"?"+":"-"}${e.amount.toLocaleString()}</div>
                  </div>
                  <button onClick={()=>del(e.id)} style={{background:"none",border:"none",color:T.muted,cursor:"pointer",padding:"2px 6px",fontSize:16,flexShrink:0}}>×</button>
                </div>
              ))}
            </Card>
          )}
        </div>
      );
    }

    function ManagerDashboard({tenantProfiles,onClose}){
      const [mTab,setMTab]=useState("overview");
      const [announcement,setAnnouncement]=useState("");
      const [announcements,setAnnouncements]=useState(()=>loadData("cg_announcements",[]));
      // Real-time announcements sync
      useEffect(()=>{
        syncFromCloud("cg_announcements",[],(a)=>{if(a&&a.length>0)setAnnouncements(a);});
        const unsub=listenCloud("cg_announcements",(a)=>{if(a)setAnnouncements(a);});
        return()=>unsub();
      },[]);
      const [selUnit,setSelUnit]=useState(null);
      const [leaseForm,setLeaseForm]=useState({name:"",startDate:"",endDate:""});
      const [leaseFile,setLeaseFile]=useState(null);
      const [leaseFileName,setLeaseFileName]=useState("");
      const [leaseUploadSuccess,setLeaseUploadSuccess]=useState(null);
      const fileInputRef=useRef();
      const handleFileSelect=(e)=>{
        const file=e.target.files[0];
        if(!file)return;
        const reader=new FileReader();
        reader.onload=(ev)=>{
          setLeaseFile(ev.target.result);
          setLeaseFileName(file.name);
          // Auto-fill lease name from filename
          const cleanName=file.name.replace(/\.[^/.]+$/,"").replace(/_/g," ");
          setLeaseForm(p=>({...p,name:p.name||cleanName}));
        };
        reader.readAsDataURL(file);
      };
      const totalExpected=UNITS.reduce((s,u)=>s+getRent(u),0);
      const totalCollected=UNITS.reduce((s,u)=>s+loadData("cg_payments_"+u,[]).reduce((ps,p)=>ps+p.total,0),0);
      const postAnn=()=>{
        if(!announcement.trim())return;
        const a={id:Date.now(),text:announcement,date:new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}),author:MANAGER.name};
        const updated=[a,...announcements];
        setAnnouncements(updated);
        saveData("cg_announcements",updated);  // saves to Firebase too
        setAnnouncement("");

      const uploadLease=()=>{
        if(!selUnit||!leaseForm.name)return;
        const leaseData={
          ...leaseForm,
          uploadedDate:new Date().toLocaleDateString(),
          fileName:leaseFileName||leaseForm.name,
          fileData:leaseFile||null,
          hasFile:!!leaseFile
        };
        saveData("cg_lease_"+selUnit,leaseData);
        saveData("cg_lease_signed_"+selUnit,false);
        setLeaseUploadSuccess(selUnit);
        setLeaseForm({name:"",startDate:"",endDate:""});
        setLeaseFile(null);setLeaseFileName("");
        setTimeout(()=>setLeaseUploadSuccess(null),3000);

      const mgrTabs=[
        {id:"overview",label:"Overview"},{id:"units",label:"Units"},
        {id:"ledger",label:"Ledger"},{id:"leases",label:"Leases"},
        {id:"screening",label:"Screening"},{id:"forum",label:"Forum"},{id:"announce",label:"Post"}
      ];

        <div style={{minHeight:"100vh",background:T.bg}}>

            <CGMark size={32}/>
            <div style={{flex:1}}>
              <div style={{fontFamily:T.serif,fontSize:17,fontWeight:900,color:T.text}}>Manager Dashboard</div>
              <div style={{fontSize:10,color:T.muted}}>{MANAGER.company} · 33 Cottage St</div>
            </div>
            <Btn onClick={onClose} variant="ghost" small>Exit</Btn>
          </div>
          <div style={{display:"flex",gap:0,borderBottom:`1px solid ${T.border}`,overflowX:"auto",background:T.surface}}>
            {mgrTabs.map(t=><button key={t.id} onClick={()=>setMTab(t.id)} style={{padding:"12px 16px",background:"none",border:"none",borderBottom:`2px solid ${mTab===t.id?T.green:"transparent"}`,color:mTab===t.id?T.green:T.muted,fontSize:13,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>{t.label}</button>)}
          </div>
          <div style={{maxWidth:480,margin:"0 auto",padding:"20px 16px 40px",display:"flex",flexDirection:"column",gap:16}}>
            {mTab==="overview"&&<>
              <div style={{fontFamily:T.serif,fontSize:22,fontWeight:900,color:T.text}}>Overview</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                {[["Total Units","7","33 Cottage St"],["Occupied",Object.keys(tenantProfiles).filter(u=>tenantProfiles[u]?.firstName).length,"with profiles"],["Monthly Expected","$"+totalExpected.toLocaleString(),"all units"],["Total Collected","$"+totalCollected.toLocaleString(),"all time"]].map(([l,v,s])=>(
                  <Card key={l} style={{padding:16}}><div style={{fontSize:10,color:T.muted,fontWeight:700,letterSpacing:"0.1em",marginBottom:6}}>{l.toUpperCase()}</div><div style={{fontSize:20,fontWeight:900,color:T.text,fontFamily:T.serif}}>{v}</div><div style={{fontSize:12,color:T.muted}}>{s}</div></Card>

                      {form.certifyAccurate&&<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#071a0e" strokeWidth="3" strokeLinecap="round"><path d="M20 6L9 17l-5-5"/></svg>}
                    </div>
                    <div style={{fontSize:13,color:"#E8ECF4",lineHeight:1.5}}>I certify all information is true and accurate *</div>
                  </div>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
                  <div style={row}><label style={lab}>Signature (Full Legal Name) *</label><input autoComplete="name" value={form.signature} onChange={upd("signature")} placeholder="Full legal name" style={inp}/></div>
                  <div style={row}><label style={lab}>Date *</label><input type="date" value={form.signDate} onChange={upd("signDate")} style={inp}/></div>
                </div>
                <div style={{display:"flex",gap:10}}>
                  <button onClick={()=>{setPage(1);window.scrollTo(0,0);}} style={{flex:1,padding:"13px",borderRadius:12,border:"1px solid #1E3024",background:"transparent",color:"#6A8070",fontSize:14,fontWeight:700,cursor:"pointer"}}>Back</button>
                  <button disabled={sending} onClick={async()=>{
                    if(!form.authCredit||!form.certifyAccurate||!form.signature||!form.fullName||!form.email){
                      alert("Please complete all required fields and check both boxes.");return;
                    }
                    setSending(true);
                    try{
                      await emailjs.send("service_p9ljggf","template_m747tql",{
                        to_email:"mszloch809@gmail.com",
                        applicant_name:form.fullName,applicant_email:form.email,applicant_phone:form.phone,
                        dob:form.dob,current_address:form.address,occupants:form.occupants,
                        pets:form.pets==="Yes"?"Yes - "+form.petDetails:"No",
                        move_in:form.moveIn,unit:form.unit||"Not specified",
                        ssn:"Provided (hidden)",dl_number:form.dlNumber||"-",
                        employment_status:form.employmentStatus,employer:form.employer||"-",
                        employer_address:form.employerAddress||"-",length_employment:form.lengthEmployment||"-",
                        supervisor_phone:form.supervisorPhone||"-",
                        monthly_income:form.monthlyIncome?"$"+parseFloat(form.monthlyIncome).toLocaleString():"-",
                        additional_income:form.additionalIncome||"-",
                        current_landlord:form.currentLandlord,
                        current_rent:form.currentRent?"$"+parseFloat(form.currentRent).toLocaleString():"-",
                        length_at_address:form.lengthAtAddress||"-",reason_leaving:form.reasonLeaving,
                        prev_landlord:form.prevLandlord||"-",
                        ref1:form.ref1Name+" - "+form.ref1Rel+" - "+form.ref1Phone,
                        ref2:form.ref2Name+" - "+form.ref2Rel+" - "+form.ref2Phone,
                        vehicle:form.hasVehicle==="Yes"?form.vehicleYear+" "+form.vehicleMake+" - "+form.vehiclePlate:"None",
                        signature:form.signature,sign_date:form.signDate,
                        submitted_at:new Date().toLocaleString()
                      });
                      setSubmitted(true);window.scrollTo(0,0);
                    }catch(err){
                      alert("Submission failed. Please try again.");console.error(err);
                    }finally{setSending(false);}
                  }} style={{flex:2,padding:"13px",borderRadius:12,border:"none",background:sending?"#2A3F30":"linear-gradient(135deg,#3EC98E,#2aaa72)",color:sending?"#6A8070":"#071a0e",fontSize:14,fontWeight:800,cursor:sending?"not-allowed":"pointer"}}>
                    {sending?"Submitting...":"Submit Application"}
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    function App(){
      const [splashDone,setSplashDone]=useState(false);
      const [selectedUnit,setSelectedUnit]=useState(null);
      const [showSetup,setShowSetup]=useState(false);
      const [tenantProfiles,setTenantProfiles]=useState(()=>{
        const combined=loadData("cg_profiles",{});
        ["101","102","201","202","301","302","303"].forEach(u=>{
          if(!combined[u]){
            const individual=loadData("cg_profile_"+u,null);
            if(individual)combined[u]=individual;
          }
        });
        return combined;
      });
      const [tab,setTab]=useState("home");
      const [pinVerified,setPinVerified]=useState(false);
      const [showMgrLogin,setShowMgrLogin]=useState(false);
      const [showMgr,setShowMgr]=useState(false);
      const [showApplicant,setShowApplicant]=useState(false);
      const [showUnitSelect,setShowUnitSelect]=useState(false);

      useEffect(()=>{saveData("cg_unit",selectedUnit);},[selectedUnit]);
      useEffect(()=>{saveData("cg_profiles",tenantProfiles);},[tenantProfiles]);
      useEffect(()=>{saveData("cg_tab",tab);},[tab]);

      // ── Firebase status ────────────────────────────────────────────────
      const [fbStatus,setFbStatus]=useState("checking");
      useEffect(()=>{
        if(!window.db){setFbStatus("offline");return;}
        let attempts=0;
        const check=()=>{
          attempts++;
          if(window.__fb_ready===true){setFbStatus("online");return;}
          if(attempts>8){setFbStatus("offline");return;}
          setTimeout(check,600);
        };
        setTimeout(check,800);
      },[]);

      // ── Real-time Firebase listeners ──────────────────────────────────
      useEffect(()=>{
        // Listen for real-time profile changes — when any tenant updates their info
        // we immediately see it without refreshing
        const unsubProfiles = listenCloud("cg_profiles",(cloudProfiles)=>{
          if(cloudProfiles&&Object.keys(cloudProfiles).length>0){
            setTenantProfiles(prev=>{
              const merged={...prev};
              Object.keys(cloudProfiles).forEach(u=>{
                if(cloudProfiles[u]&&cloudProfiles[u].firstName){
                  merged[u]=cloudProfiles[u];
                  // Also update localStorage cache per unit
                  try{localStorage.setItem("cg_profile_"+u,JSON.stringify(cloudProfiles[u]));}catch(e){}
                }
              });
              return merged;
            });
          }
        });
        return()=>unsubProfiles();
      },[]);

      const handleUnitSelect=(unit)=>{setSelectedUnit(unit);setPinVerified(false);setShowUnitSelect(false);};
      const handlePinSuccess=()=>{
        setPinVerified(true);
        saveData("cg_pin_verified_"+selectedUnit, true);
        if(!tenantProfiles[selectedUnit]?.firstName)setShowSetup(true);
      };
      const handleProfileSave=(profile)=>{
        const u={...tenantProfiles,[selectedUnit]:profile};
        setTenantProfiles(u);
        // Save to localStorage
        saveData("cg_profiles",u);
        saveData("cg_profile_"+selectedUnit,profile);
        if(window.db){
          window.db._write("cg_profile_"+selectedUnit,profile);
          window.db._write("cg_profiles",u);
        }
        setShowSetup(false);
        setTab("home");
      };
      const handleBack=()=>{if(showSetup){setShowSetup(false);if(!tenantProfiles[selectedUnit]?.firstName){setPinVerified(false);setSelectedUnit(null);}}else{setPinVerified(false);setSelectedUnit(null);}};
      const handleSwitchUnit=()=>{setSelectedUnit(null);setPinVerified(false);setShowSetup(false);setTab("home");setShowUnitSelect(false);};
      const handleLogoTap=()=>{const n=logoTaps+1;setLogoTaps(n);};

      const tenant=tenantProfiles[selectedUnit]||{};
      const isInApp=selectedUnit&&pinVerified&&!showSetup&&tenant.firstName;

      if(showMgr)return <ManagerDashboard tenantProfiles={tenantProfiles} onClose={()=>setShowMgr(false)}/>;
      if(showMgrLogin)return <ManagerLogin onSuccess={()=>{setShowMgrLogin(false);setShowMgr(true);}} onBack={()=>setShowMgrLogin(false)}/>;
      if(showApplicant)return <TenantApplication onBack={()=>setShowApplicant(false)}/>;
      if(showUnitSelect&&!selectedUnit)return <UnitSelect tenantProfiles={tenantProfiles} onSelect={handleUnitSelect} onBack={()=>setShowUnitSelect(false)}/>;
      if(selectedUnit&&!pinVerified)return <PinScreen unit={selectedUnit} onSuccess={handlePinSuccess} onBack={()=>{setSelectedUnit(null);setShowUnitSelect(true);}}/>;
      if(selectedUnit&&pinVerified&&showSetup)return <TenantSetup unit={selectedUnit} existing={tenantProfiles[selectedUnit]} onSave={handleProfileSave} onBack={handleBack}/>;

      const tabs=[
        {id:"home",label:"Home",icon:"M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z M9 22V12h6v10"},
        {id:"pay",label:"Pay",icon:"M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"},
        {id:"messages",label:"Messages",icon:"M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"},
        {id:"forum",label:"Forum",icon:"M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2 M9 7a4 4 0 100 8 4 4 0 000-8z M23 21v-2a4 4 0 00-3-3.87 M16 3.13a4 4 0 010 7.75"},
        {id:"lease",label:"Lease",icon:"M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z M14 2v6h6 M16 13H8 M16 17H8 M10 9H8"},
      ];

      const screens={
        home:<Dashboard setTab={setTab} tenant={tenant} unit={selectedUnit}/>,
        pay:<PayRent unit={selectedUnit} tenant={tenant}/>,
        messages:<Messages tenant={tenant} unit={selectedUnit}/>,
        forum:<Forum tenant={tenant} unit={selectedUnit}/>,
        lease:<LeaseScreen unit={selectedUnit} tenant={tenant}/>,
      };

      return(
        <div style={{minHeight:"100vh",background:T.bg,color:T.text}}>
          {!splashDone&&<Splash onDone={()=>setSplashDone(true)}/>}
          {splashDone&&!isInApp&&(
            <Landing
              onTenant={()=>setShowUnitSelect(true)}
              onManager={()=>setShowMgrLogin(true)}
              onApplicant={()=>setShowApplicant(true)}
            />
          )}
          {splashDone&&isInApp&&(
            <>
              <div style={{position:"sticky",top:0,zIndex:10,background:T.bg+"f0",backdropFilter:"blur(14px)",borderBottom:`1px solid ${T.border}`,padding:"12px 18px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <CGMark size={32}/>
                  <div>
                    <CGWordmark size={17}/>
                    <div style={{fontSize:10,color:T.muted,letterSpacing:"0.06em"}}>
                      33 Cottage St · Unit {selectedUnit}
                      <span style={{marginLeft:6,color:fbStatus==="online"?T.green:T.red}}>
                        {fbStatus==="online"?"● Live":"○ Offline"}
                      </span>
                    </div>
                  </div>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <button onClick={()=>setShowSetup(true)} style={{background:"none",border:"none",cursor:"pointer",padding:0}}>
                    <div style={{width:38,height:38,borderRadius:"50%",background:`linear-gradient(135deg,${T.green},#2aaa72)`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,fontWeight:900,color:"#071a0e",fontFamily:T.serif}}>
                      {initials(`${tenant.firstName} ${tenant.lastName}`)}
                    </div>
                  </button>
                  <button onClick={handleSwitchUnit} style={{background:T.faint,border:`1px solid ${T.border}`,borderRadius:8,padding:"5px 9px",cursor:"pointer",fontSize:10,fontWeight:700,color:T.muted}}>Switch</button>
                </div>
              </div>
              <div style={{maxWidth:480,margin:"0 auto",padding:"20px 16px 90px"}}>{screens[tab]}</div>
              <div style={{position:"fixed",bottom:0,left:0,right:0,background:T.surface+"f8",backdropFilter:"blur(18px)",borderTop:`1px solid ${T.border}`,display:"flex",justifyContent:"space-around",padding:"10px 0 max(10px,env(safe-area-inset-bottom))",zIndex:20}}>
                {tabs.map(t=>{
                  const active=tab===t.id;
                  return(
                    <button key={t.id} onClick={()=>setTab(t.id)} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4,background:"none",border:"none",cursor:"pointer",padding:"4px 12px",color:active?T.green:T.muted,transition:"color 0.18s",position:"relative"}}>
                      {active&&<div style={{position:"absolute",top:-10,left:"50%",transform:"translateX(-50%)",width:32,height:2,borderRadius:2,background:T.green}}/>}
                      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d={t.icon}/></svg>
                      <span style={{fontSize:10,fontWeight:700}}>{t.label}</span>
                    </button>
                  );
                })}
              </div>
            </>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
