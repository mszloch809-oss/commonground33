const IC={home:"M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z M9 22V12h6v10",pay:"M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z",msg:"M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z",forum:"M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2 M9 7a4 4 0 100 8 4 4 0 000-8z M23 21v-2a4 4 0 00-3-3.87 M16 3.13a4 4 0 010 7.75",send:"M22 2L11 13 M22 2L15 22 8.5 13.5 2 9z",check:"M20 6L9 17l-5-5",alert:"M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z M12 9v4M12 17h.01",back:"M19 12H5M12 5l-7 7 7 7",link:"M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71 M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71",person:"M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2 M12 3a4 4 0 100 8 4 4 0 000-8z",lock:"M19 11H5a2 2 0 00-2 2v7a2 2 0 002 2h14a2 2 0 002-2v-7a2 2 0 00-2-2z M17 11V7a5 5 0 00-10 0v4",doc:"M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z M14 2v6h6 M16 13H8 M16 17H8 M10 9H8",search:"M11 17a6 6 0 100-12 6 6 0 000 12z M21 21l-4.35-4.35",receipt:"M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2 M9 5a2 2 0 002 2h2a2 2 0 002-2 M9 5a2 2 0 012-2h2a2 2 0 012 2 M9 12h6 M9 16h4",print:"M6 9V2h12v7 M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2 M6 14h12v8H6z",upload:"M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4 M17 8l-5-5-5 5 M12 3v12",sign:"M12 20h9 M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z",dash:"M3 3h7v7H3z M14 3h7v7h-7z M14 14h7v7h-7z M3 14h7v7H3z",announce:"M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5 M17 3a2.828 2.828 0 114 4L12 15l-4 1 1-4 8-9z"};

function Splash({onDone}){const [p,setP]=useState(0);useEffect(()=>{const t1=setTimeout(()=>setP(1),300),t2=setTimeout(()=>setP(2),900),t3=setTimeout(()=>setP(3),1600),t4=setTimeout(()=>onDone(),2600);return()=>[t1,t2,t3,t4].forEach(clearTimeout);},[]);return(<div style={{position:"fixed",inset:0,zIndex:999,background:T.bg,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:20}}><div style={{position:"absolute",width:300,height:300,borderRadius:"50%",background:T.greenGlow,filter:"blur(80px)",top:"30%",left:"50%",transform:"translate(-50%,-50%)",opacity:p>=1?1:0,transition:"opacity 1s ease"}}/><div style={{opacity:p>=1?1:0,transform:p>=1?"scale(1)":"scale(0.7)",transition:"all 0.6s cubic-bezier(0.34,1.56,0.64,1)"}}><CGMark size={88}/></div><div style={{opacity:p>=2?1:0,transform:p>=2?"translateY(0)":"translateY(12px)",transition:"all 0.5s ease",textAlign:"center"}}><CGWordmark size={32}/><div style={{fontSize:11,color:T.muted,letterSpacing:"0.18em",textTransform:"uppercase",marginTop:6}}>Connected Living</div></div><div style={{display:"flex",gap:6,marginTop:12,opacity:p>=3?1:0,transition:"opacity 0.4s ease"}}>{[0,1,2].map(i=><div key={i} style={{width:6,height:6,borderRadius:"50%",background:T.green,animation:"pulse 1s ease-in-out infinite",animationDelay:`${i*0.2}s`}}/>)}</div></div>);}

function PinScreen({unit,onSuccess,onBack}){const [pin,setPin]=useState("");const [error,setError]=useState(false);const [shake,setShake]=useState(false);const correct=UNIT_PINS[unit];const tap=(d)=>{if(pin.length>=4)return;const next=pin+d;setPin(next);if(next.length===4){if(next===correct){onSuccess();}else{setError(true);setShake(true);setTimeout(()=>{setPin("");setError(false);setShake(false);},600);}}};const del=()=>setPin(p=>p.slice(0,-1));return(<div style={{minHeight:"100vh",background:T.bg,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24}}><div style={{marginBottom:24,textAlign:"center"}}><CGMark size={48}/><div style={{marginTop:12}}><CGWordmark size={22}/></div><div style={{fontSize:13,color:T.muted,marginTop:6}}>Unit {unit} · Enter PIN</div></div><div style={{display:"flex",gap:14,marginBottom:32,transform:shake?"translateX(8px)":"none",transition:"transform 0.1s"}}>{[0,1,2,3].map(i=><div key={i} style={{width:18,height:18,borderRadius:"50%",border:`2px solid ${error?T.red:T.green}`,background:i<pin.length?(error?T.red:T.green):"transparent",transition:"all 0.2s"}}/>)}</div><div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,width:"100%",maxWidth:260}}>{[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map((k,i)=><button key={i} onClick={()=>k==="⌫"?del():k!==""?tap(String(k)):null} style={{padding:"18px 0",borderRadius:14,border:`1px solid ${T.border}`,background:k===""?T.bg:T.card,color:T.text,fontSize:22,fontWeight:700,cursor:k===""?"default":"pointer",opacity:k===""?0:1,fontFamily:T.serif}}>{k}</button>)}</div><button onClick={onBack} style={{marginTop:24,background:"none",border:"none",color:T.muted,fontSize:13,cursor:"pointer"}}>← Back to units</button>{error&&<div style={{marginTop:12,color:T.red,fontSize:13,fontWeight:600}}>Incorrect PIN. Try again.</div>}</div>);}

function ManagerLogin({onSuccess,onBack}){const [pw,setPw]=useState("");const [error,setError]=useState(false);const check=()=>{if(pw===MANAGER.password)onSuccess();else{setError(true);setTimeout(()=>setError(false),2000);}};return(<div style={{minHeight:"100vh",background:T.bg,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24}}><CGMark size={48}/><div style={{margin:"12px 0 4px"}}><CGWordmark size={22}/></div><div style={{fontSize:13,color:T.muted,marginBottom:32}}>Manager Access</div><Card style={{width:"100%",maxWidth:360}}><div style={{fontSize:11,color:T.muted,fontWeight:700,letterSpacing:"0.1em",marginBottom:12}}>ENTER MANAGER PASSWORD</div><Input type="password" value={pw} onChange={setPw} placeholder="Password"/>{error&&<div style={{color:T.red,fontSize:12,marginTop:8}}>Incorrect password.</div>}<div style={{marginTop:14,display:"flex",gap:8}}><Btn onClick={onBack} variant="ghost">Cancel</Btn><Btn onClick={check} disabled={!pw} full>Access Dashboard</Btn></div></Card></div>);}

function UnitSelect({tenantProfiles,onSelect,onManagerTap}){const [taps,setTaps]=useState(0);const [showMgr,setShowMgr]=useState(false);const handleLogo=()=>{const n=taps+1;setTaps(n);if(n>=5)setShowMgr(true);};return(<div style={{minHeight:"100vh",background:T.bg,display:"flex",flexDirection:"column",alignItems:"center",padding:"40px 20px 60px"}}><div style={{position:"fixed",width:280,height:280,borderRadius:"50%",background:T.greenGlow,filter:"blur(70px)",top:"15%",left:"50%",transform:"translateX(-50%)",pointerEvents:"none"}}/><div style={{animation:"fadeUp 0.5s ease both",textAlign:"center",marginBottom:32}} onClick={handleLogo}><CGMark size={56}/><div style={{marginTop:12}}><CGWordmark size={26}/></div><div style={{fontSize:13,color:T.muted,marginTop:6}}>33 Cottage St</div></div>{showMgr&&<div style={{marginBottom:16}}><Btn onClick={onManagerTap} variant="gold" small>Manager Dashboard</Btn></div>}<div style={{animation:"fadeUp 0.5s 0.1s ease both",width:"100%",maxWidth:400}}><div style={{fontSize:12,color:T.muted,fontWeight:700,letterSpacing:"0.14em",textAlign:"center",marginBottom:24}}>TAP YOUR UNIT NUMBER TO GET STARTED</div>{["1","2","3"].map(floor=>(<div key={floor} style={{marginBottom:24}}><div style={{fontSize:11,color:T.green,fontWeight:700,letterSpacing:"0.12em",marginBottom:10}}>{FLOOR_LABELS[floor]}</div><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>{UNITS.filter(u=>u.startsWith(floor)).map(unit=>{const profile=tenantProfiles[unit];const has=profile&&profile.firstName;return(<div key={unit} onClick={()=>onSelect(unit)} style={{background:has?T.greenDim:T.card,border:`1.5px solid ${has?T.green+"55":T.border}`,borderRadius:16,padding:"16px 14px",cursor:"pointer",display:"flex",alignItems:"center",gap:12,transition:"all 0.18s"}}><div style={{width:46,height:46,borderRadius:13,flexShrink:0,background:has?`linear-gradient(135deg,${T.green},#2aaa72)`:T.faint,display:"flex",alignItems:"center",justifyContent:"center",fontSize:has?14:17,fontWeight:900,color:has?"#071a0e":T.muted,fontFamily:T.serif}}>{has?initials(`${profile.firstName} ${profile.lastName}`):unit}</div><div><div style={{fontSize:15,fontWeight:800,color:T.text,fontFamily:T.serif,lineHeight:1.2}}>Unit {unit}</div><div style={{fontSize:11,color:T.muted,marginTop:1}}>{getType(unit)}</div>{has?<div style={{fontSize:12,color:T.green,fontWeight:600,marginTop:2}}>{profile.firstName} {profile.lastName}</div>:<div style={{fontSize:11,color:T.muted,marginTop:2}}>Tap to set up</div>}</div></div>);})}</div></div>))}<div style={{textAlign:"center",fontSize:12,color:T.muted,lineHeight:1.7}}>Select your unit to create your tenant profile.<br/>Your info is only shared with your property manager.</div></div></div>);}

function TenantSetup({unit,existing,onSave,onBack}){const [firstName,setFirstName]=useState(existing?.firstName||"");const [lastName,setLastName]=useState(existing?.lastName||"");const [phone,setPhone]=useState(existing?.phone||"");const [email,setEmail]=useState(existing?.email||"");const [moveIn,setMoveIn]=useState(existing?.moveIn||"");const [leaseEnd,setLeaseEnd]=useState(existing?.leaseEnd||"");const [emergency,setEmergency]=useState(existing?.emergency||"");const [saved,setSaved]=useState(false);const isNew=!existing?.firstName;const handleSave=()=>{if(!firstName.trim()||!lastName.trim())return;onSave({firstName:firstName.trim(),lastName:lastName.trim(),phone,email,moveIn,leaseEnd,emergency});setSaved(true);setTimeout(()=>setSaved(false),1800);};return(<div style={{minHeight:"100vh",background:T.bg,paddingBottom:40}}><div style={{position:"sticky",top:0,zIndex:10,background:T.bg+"f0",backdropFilter:"blur(14px)",borderBottom:`1px solid ${T.border}`,padding:"14px 18px",display:"flex",alignItems:"center",gap:12}}><button onClick={onBack} style={{background:"none",border:"none",cursor:"pointer",padding:4}}><Icon d={IC.back} size={22} color={T.green}/></button><div style={{flex:1}}><div style={{fontFamily:T.serif,fontSize:18,fontWeight:900,color:T.text}}>Unit {unit}</div><div style={{fontSize:11,color:T.muted}}>33 Cottage St · {getType(unit)} · {isNew?"Create Profile":"Edit Profile"}</div></div><CGMark size={28}/></div><div style={{maxWidth:480,margin:"0 auto",padding:"24px 16px",display:"flex",flexDirection:"column",gap:18}}><div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:10,paddingBottom:4}}><div style={{width:76,height:76,borderRadius:"50%",background:firstName?`linear-gradient(135deg,${T.green},#2aaa72)`:T.faint,display:"flex",alignItems:"center",justifyContent:"center",fontSize:26,fontWeight:900,color:firstName?"#071a0e":T.muted,fontFamily:T.serif,border:`3px solid ${firstName?T.green+"55":T.border}`}}>{firstName?initials(`${firstName} ${lastName}`):unit}</div><div style={{fontSize:13,color:firstName?T.text:T.muted,fontWeight:firstName?700:400}}>{firstName?`${firstName} ${lastName}`.trim():"Your name appears here"}</div></div><Card><div style={{fontSize:11,color:T.muted,fontWeight:700,letterSpacing:"0.1em",marginBottom:14}}>YOUR NAME *</div><div style={{display:"flex",flexDirection:"column",gap:10}}><div><div style={{fontSize:12,color:T.muted,marginBottom:4}}>First Name</div><Input value={firstName} onChange={setFirstName} placeholder="e.g. Jamie"/></div><div><div style={{fontSize:12,color:T.muted,marginBottom:4}}>Last Name</div><Input value={lastName} onChange={setLastName} placeholder="e.g. Rivera"/></div></div></Card><Card><div style={{fontSize:11,color:T.muted,fontWeight:700,letterSpacing:"0.1em",marginBottom:14}}>CONTACT INFO</div><div style={{display:"flex",flexDirection:"column",gap:12}}><div><div style={{fontSize:12,color:T.muted,marginBottom:4}}>Phone Number</div><Input value={phone} onChange={setPhone} placeholder="(555) 000-0000" type="tel"/></div><div><div style={{fontSize:12,color:T.muted,marginBottom:4}}>Email Address</div><Input value={email} onChange={setEmail} placeholder="you@email.com" type="email"/></div></div></Card><Card><div style={{fontSize:11,color:T.muted,fontWeight:700,letterSpacing:"0.1em",marginBottom:14}}>LEASE DETAILS</div><div style={{display:"flex",flexDirection:"column",gap:12}}><div><div style={{fontSize:12,color:T.muted,marginBottom:4}}>Move-In Date</div><Input value={moveIn} onChange={setMoveIn} placeholder="MM/DD/YYYY"/></div><div><div style={{fontSize:12,color:T.muted,marginBottom:4}}>Lease End Date</div><Input value={leaseEnd} onChange={setLeaseEnd} placeholder="MM/DD/YYYY"/></div></div></Card><Card><div style={{fontSize:11,color:T.muted,fontWeight:700,letterSpacing:"0.1em",marginBottom:12}}>EMERGENCY CONTACT</div><Input value={emergency} onChange={setEmergency} placeholder="e.g. Mom – (555) 111-2222"/></Card><Btn onClick={handleSave} disabled={!firstName.trim()||!lastName.trim()} icon={<Icon d={saved?IC.check:IC.person} size={16} color="#071a0e" stroke={saved?2.5:1.8}/>} full>{saved?"Profile Saved! ✓":isNew?"Create My Profile":"Save Changes"}</Btn><div style={{fontSize:11,color:T.muted,textAlign:"center",lineHeight:1.7}}>Your information is only shared with your property manager at 33 Cottage St.</div></div></div>);}

function Dashboard({setTab,tenant,unit}){const amount=getRent(unit);const unitType=getType(unit);const payments=load(`cg_payments_${unit}`,[]);return(<div style={{display:"flex",flexDirection:"column",gap:18}}><div style={{background:"linear-gradient(145deg,#0D2518 0%,#071A10 100%)",borderRadius:22,padding:24,position:"relative",overflow:"hidden",border:`1px solid ${T.green}33`}}><div style={{position:"absolute",top:-40,right:-40,width:180,height:180,borderRadius:"50%",background:T.greenGlow,filter:"blur(30px)"}}/><div style={{fontSize:11,color:T.green,fontWeight:700,letterSpacing:"0.14em",marginBottom:8}}>NEXT PAYMENT DUE</div><div style={{fontSize:42,fontWeight:900,color:"#fff",fontFamily:T.serif,letterSpacing:"-1.5px",lineHeight:1}}>${amount.toLocaleString()}</div><div style={{color:T.muted,fontSize:13,marginTop:6}}>Due 1st of each month &nbsp;·&nbsp;<span style={{color:T.gold,fontWeight:600}}>Unit {unit}</span></div><div style={{marginTop:18}}><Btn onClick={()=>setTab("pay")} icon={<Icon d={IC.send} size={15} color="#071a0e"/>}>Pay Rent Now</Btn></div></div><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>{[{label:"Unit",value:unit,sub:unitType+" · 33 Cottage St"},{label:"Lease Ends",value:tenant.leaseEnd||"—",sub:tenant.leaseEnd?"":"Not set yet"},{label:"Payments Made",value:payments.length,sub:"This lease"},{label:"Total Paid",value:"$"+payments.reduce((s,p)=>s+p.total,0).toLocaleString(),sub:"All time"}].map(s=>(<Card key={s.label} style={{padding:16}}><div style={{fontSize:10,color:T.muted,fontWeight:700,letterSpacing:"0.1em",marginBottom:6}}>{s.label.toUpperCase()}</div><div style={{fontSize:22,fontWeight:900,color:T.text,fontFamily:T.serif}}>{s.value}</div><div style={{fontSize:12,color:T.muted}}>{s.sub}</div></Card>))}</div><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>{[{label:"Send Message",tab:"messages",icon:IC.msg,color:T.green},{label:"Building Forum",tab:"forum",icon:IC.forum,color:"#7BCFB8"},{label:"Pay Rent",tab:"pay",icon:IC.pay,color:T.gold},{label:"My Lease",tab:"lease",icon:IC.doc,color:"#A8D5B5"}].map(n=>(<Card key={n.tab} onClick={()=>setTab(n.tab)} style={{padding:16,cursor:"pointer"}}><div style={{width:42,height:42,borderRadius:13,background:n.color+"22",display:"flex",alignItems:"center",justifyContent:"center",marginBottom:10}}><Icon d={n.icon} size={18} color={n.color}/></div><div style={{fontSize:13,fontWeight:700,color:T.text}}>{n.label}</div></Card>))}</div><Card><div style={{fontSize:12,fontWeight:700,color:T.muted,letterSpacing:"0.1em",marginBottom:14}}>PAYMENT HISTORY</div>{payments.length===0?<div style={{textAlign:"center",padding:"20px 0",color:T.muted,fontSize:13}}>No payments yet. Your history appears here after your first payment.</div>:payments.slice().reverse().map((p,i)=>(<div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"11px 0",borderBottom:`1px solid ${T.border}`}}><div><div style={{fontSize:13,fontWeight:600,color:T.text}}>{p.desc}</div><div style={{fontSize:11,color:T.muted}}>{p.date} · {p.method}</div></div><div style={{display:"flex",alignItems:"center",gap:8}}><span style={{fontSize:14,fontWeight:800,color:T.green,fontFamily:T.serif}}>${p.total.toLocaleString()}</span><Badge color={T.green}>Paid</Badge></div></div>))}</Card></div>);}

const CHARGE_DEFS=[{id:"rent",label:"Monthly Rent",required:true,color:"#3EC98E"},{id:"parking",label:"Parking Fee",required:false,color:"#7BCFB8",defaultAmt:75},{id:"pet",label:"Pet Fee",required:false,color:"#F5A442",defaultAmt:50},{id:"fine",label:"Fine / Fee",required:false,color:"#F76F6F",defaultAmt:0}];

function PayRent({unit,tenant}){const unitRent=getRent(unit);const unitType=getType(unit);const [charges,setCharges]=useState(CHARGE_DEFS.reduce((acc,c)=>({...acc,[c.id]:{enabled:c.required,amount:c.id==="rent"?unitRent:(c.defaultAmt||0)}}),{}));const [method,setMethod]=useState(null);const [note,setNote]=useState("");const [sent,setSent]=useState(false);const [loading,setLoading]=useState(false);const [receipt,setReceipt]=useState(null);const toggle=(id)=>{if(CHARGE_DEFS.find(c=>c.id===id).required)return;setCharges(p=>({...p,[id]:{...p[id],enabled:!p[id].enabled}}));};const updateAmt=(id,val)=>setCharges(p=>({...p,[id]:{...p[id],amount:parseFloat(val)||0}}));const total=CHARGE_DEFS.reduce((s,c)=>charges[c.id].enabled?s+(charges[c.id].amount||0):s,0);const now=new Date();const dateStr=now.toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"});const monthStr=now.toLocaleDateString("en-US",{month:"long",year:"numeric"});const handlePay=()=>{setLoading(true);setTimeout(()=>{const r={id:"RCP-"+Date.now(),date:dateStr,month:monthStr,unit,unitType,tenant:tenant?`${tenant.firstName} ${tenant.lastName}`:"Tenant",method:method==="wire"?"Wire Transfer":"ACH Bank Transfer",charges:CHARGE_DEFS.filter(c=>charges[c.id].enabled).map(c=>({label:c.label,amount:charges[c.id].amount})),total,desc:`Rent – ${monthStr}`};const existing=load(`cg_payments_${unit}`,[]);save(`cg_payments_${unit}`,[...existing,{date:dateStr,desc:`Rent – ${monthStr}`,total,method:r.method}]);setReceipt(r);setLoading(false);setSent(true);},1800);};
if(sent&&receipt)return(<div style={{display:"flex",flexDirection:"column",gap:16}}><div style={{textAlign:"center",paddingBottom:8}}><div style={{width:72,height:72,borderRadius:"50%",background:T.greenDim,border:`2px solid ${T.green}44`,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto",animation:"popIn 0.4s cubic-bezier(0.34,1.56,0.64,1)"}}><Icon d={IC.check} size={32} color={T.green} stroke={2.5}/></div><div style={{fontFamily:T.serif,fontSize:26,fontWeight:900,color:T.text,marginTop:12}}>Payment Confirmed!</div><div style={{color:T.muted,fontSize:13,marginTop:4}}>Receipt #{receipt.id}</div></div><Card style={{borderColor:T.green+"44"}}><div style={{textAlign:"center",marginBottom:16,paddingBottom:16,borderBottom:`1px solid ${T.border}`}}><CGMark size={32}/><div style={{fontFamily:T.serif,fontSize:16,fontWeight:900,color:T.text,marginTop:6}}>CommonGround</div><div style={{fontSize:11,color:T.muted}}>{MANAGER.company}</div><div style={{fontSize:11,color:T.muted}}>33 Cottage St</div></div><div style={{fontSize:11,color:T.muted,fontWeight:700,letterSpacing:"0.1em",marginBottom:12}}>PAYMENT RECEIPT</div>{[{label:"Receipt #",val:receipt.id},{label:"Date",val:receipt.date},{label:"Tenant",val:receipt.tenant},{label:"Unit",val:`Unit ${receipt.unit} · ${receipt.unitType}`},{label:"Period",val:receipt.month},{label:"Method",val:receipt.method}].map(r=>(<div key={r.label} style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:`1px solid ${T.border}`}}><span style={{fontSize:12,color:T.muted}}>{r.label}</span><span style={{fontSize:12,fontWeight:700,color:T.text}}>{r.val}</span></div>))}<div style={{marginTop:12,paddingTop:4}}><div style={{fontSize:11,color:T.muted,fontWeight:700,letterSpacing:"0.1em",marginBottom:8}}>CHARGES</div>{receipt.charges.map((c,i)=>(<div key={i} style={{display:"flex",justifyContent:"space-between",padding:"6px 0"}}><span style={{fontSize:13,color:T.text}}>{c.label}</span><span style={{fontSize:13,fontWeight:600,color:T.text}}>${c.amount.toLocaleString()}</span></div>))}<div style={{display:"flex",justifyContent:"space-between",padding:"12px 0 0",borderTop:`2px solid ${T.green}44`,marginTop:8}}><span style={{fontSize:15,fontWeight:800,color:T.text}}>Total Paid</span><span style={{fontSize:15,fontWeight:900,color:T.green,fontFamily:T.serif}}>${receipt.total.toLocaleString()}</span></div></div><div style={{marginTop:14,padding:10,borderRadius:10,background:T.greenDim,textAlign:"center"}}><div style={{fontSize:11,color:T.green,fontWeight:700}}>✓ Payment Processed Successfully</div><div style={{fontSize:11,color:T.muted,marginTop:2}}>Keep this receipt for your records</div></div></Card><Btn onClick={()=>window.print()} variant="green" icon={<Icon d={IC.print} size={15} color={T.green}/>} full>Print / Save Receipt</Btn><Btn onClick={()=>{setSent(false);setReceipt(null);setMethod(null);setNote("");setCharges(CHARGE_DEFS.reduce((acc,c)=>({...acc,[c.id]:{enabled:c.required,amount:c.id==="rent"?unitRent:(c.defaultAmt||0)}}),{}));}} variant="ghost" full>Make Another Payment</Btn></div>);
return(<div style={{display:"flex",flexDirection:"column",gap:18}}><div style={{fontFamily:T.serif,fontSize:24,fontWeight:900,color:T.text}}>Pay Rent</div><Card><div style={{fontSize:11,color:T.muted,fontWeight:700,letterSpacing:"0.1em",marginBottom:4}}>CHARGES DUE</div><div style={{fontSize:12,color:T.green,fontWeight:600,marginBottom:14}}>Unit {unit} · {unitType}</div>{CHARGE_DEFS.map(c=>{const active=charges[c.id].enabled;return(<div key={c.id} style={{marginBottom:12}}><div onClick={()=>toggle(c.id)} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 14px",borderRadius:12,border:`1.5px solid ${active?c.color+"55":T.border}`,background:active?c.color+"0D":T.surface,cursor:c.required?"default":"pointer",transition:"all 0.18s",marginBottom:active?8:0}}><div style={{width:22,height:22,borderRadius:"50%",border:`2px solid ${active?c.color:T.border}`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{active&&<div style={{width:10,height:10,borderRadius:"50%",background:c.color}}/>}</div><div style={{flex:1}}><div style={{fontSize:14,fontWeight:700,color:active?T.text:T.muted}}>{c.label}</div>{!active&&!c.required&&<div style={{fontSize:11,color:T.muted}}>Tap to add</div>}{c.required&&<div style={{fontSize:11,color:T.muted}}>Required</div>}</div>{active&&<div style={{fontFamily:T.serif,fontSize:16,fontWeight:900,color:c.color}}>${(charges[c.id].amount||0).toLocaleString()}</div>}</div>{active&&(<div style={{display:"flex",alignItems:"center",gap:10,padding:"0 4px"}}><div style={{fontSize:12,color:T.muted,whiteSpace:"nowrap"}}>Amount ($)</div><div style={{position:"relative",flex:1}}><span style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",color:c.color,fontWeight:800}}>$</span><input value={charges[c.id].amount} onChange={e=>updateAmt(c.id,e.target.value)} disabled={c.id==="rent"} style={{width:"100%",background:T.surface,border:`1px solid ${c.color}44`,borderRadius:10,padding:"9px 12px 9px 26px",color:T.text,fontSize:16,fontFamily:T.serif,fontWeight:800,outline:"none",boxSizing:"border-box",opacity:c.id==="rent"?0.7:1}}/></div></div>)}</div>);})}<div style={{borderTop:`1px solid ${T.border}`,marginTop:8,paddingTop:14,display:"flex",justifyContent:"space-between",alignItems:"center"}}><div><div style={{fontSize:11,color:T.muted,fontWeight:700,letterSpacing:"0.1em"}}>TOTAL DUE</div><div style={{fontSize:11,color:T.muted,marginTop:2}}>{CHARGE_DEFS.filter(c=>charges[c.id].enabled).length} charges</div></div><div style={{fontFamily:T.serif,fontSize:32,fontWeight:900,color:T.green}}>${total.toLocaleString()}</div></div></Card><Input value={note} onChange={setNote} placeholder="Note to manager (optional)"/><Card><div style={{fontSize:11,color:T.muted,fontWeight:700,letterSpacing:"0.1em",marginBottom:14}}>PAYMENT METHOD</div>{[{id:"ach",label:"ACH Bank Transfer",sub:"Free · 2–3 business days",color:T.green},{id:"wire",label:"Wire Transfer",sub:"$15 fee · Same business day",color:T.gold}].map(m=>(<div key={m.id} onClick={()=>setMethod(m.id)} style={{display:"flex",alignItems:"center",gap:14,padding:"14px 16px",borderRadius:12,border:`2px solid ${method===m.id?m.color:T.border}`,background:method===m.id?m.color+"10":T.surface,cursor:"pointer",transition:"all 0.18s",marginBottom:10}}><div style={{width:22,height:22,borderRadius:"50%",border:`2px solid ${method===m.id?m.color:T.border}`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{method===m.id&&<div style={{width:10,height:10,borderRadius:"50%",background:m.color}}/>}</div><div><div style={{fontSize:14,fontWeight:700,color:T.text}}>{m.label}</div><div style={{fontSize:12,color:T.muted}}>{m.sub}</div></div></div>))}</Card><Btn onClick={handlePay} disabled={!method||loading||total===0} icon={<Icon d={IC.send} size={15} color="#071a0e"/>} full>{loading?"Processing…":`Send $${total.toLocaleString()}`}</Btn><div style={{textAlign:"center",fontSize:12,color:T.muted}}>🔒 256-bit bank-level encryption</div></div>);}

function Messages({tenant,unit}){const INIT=[{id:1,from:"manager",text:`Welcome to CommonGround! I'm ${MANAGER.name}, your property manager. Message me anytime.`,time:"Today",read:true}];const [msgs,setMsgs]=useState(()=>load(`cg_msgs_${unit}`,INIT));const [input,setInput]=useState("");const [category,setCategory]=useState("general");const bottomRef=useRef();useEffect(()=>{bottomRef.current?.scrollIntoView({behavior:"smooth"});},[msgs]);useEffect(()=>{save(`cg_msgs_${unit}`,msgs);},[msgs]);const send=()=>{if(!input.trim())return;const m={id:Date.now(),from:"tenant",text:input,time:"Just now",read:true,category};setMsgs(ms=>[...ms,m]);setInput("");setTimeout(()=>{setMsgs(ms=>[...ms,{id:Date.now()+1,from:"manager",text:`Thanks for your message — I'll follow up shortly. — ${MANAGER.name}`,time:"Just now",read:true}]);},1200);};return(<div style={{display:"flex",flexDirection:"column",gap:0,height:"calc(100vh - 180px)",maxHeight:620}}><div style={{fontFamily:T.serif,fontSize:24,fontWeight:900,color:T.text,marginBottom:14}}>Messages</div><div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>{["general","maintenance","billing","noise"].map(c=><button key={c} onClick={()=>setCategory(c)} style={{padding:"5px 14px",borderRadius:20,border:`1px solid ${category===c?T.green:T.border}`,background:category===c?T.greenDim:"transparent",color:category===c?T.green:T.muted,fontSize:12,fontWeight:600,cursor:"pointer",textTransform:"capitalize",transition:"all 0.18s"}}>{c}</button>)}</div><div style={{flex:1,overflowY:"auto",display:"flex",flexDirection:"column",gap:10,paddingBottom:8}}>{msgs.map(m=>(<div key={m.id} style={{display:"flex",justifyContent:m.from==="tenant"?"flex-end":"flex-start"}}><div style={{maxWidth:"78%",background:m.from==="tenant"?`linear-gradient(135deg,${T.green},#2aaa72)`:T.card,borderRadius:m.from==="tenant"?"16px 16px 4px 16px":"16px 16px 16px 4px",padding:"10px 14px",border:`1px solid ${m.from==="tenant"?T.green+"44":T.border}`}}>{m.from==="manager"&&<div style={{fontSize:10,color:T.green,fontWeight:700,letterSpacing:"0.1em",marginBottom:4}}>MICHAEL · PROPERTY MANAGER</div>}<div style={{fontSize:14,color:m.from==="tenant"?"#071a0e":T.text,lineHeight:1.55,fontWeight:m.from==="tenant"?600:400}}>{m.text}</div><div style={{fontSize:11,color:m.from==="tenant"?"rgba(7,26,14,0.6)":T.muted,marginTop:4}}>{m.time}</div></div></div>))}<div ref={bottomRef}/></div><div style={{display:"flex",gap:10,paddingTop:12,borderTop:`1px solid ${T.border}`}}><Input value={input} onChange={setInput} placeholder={`${category} message…`} style={{flex:1}}/><Btn onClick={send} disabled={!input.trim()} icon={<Icon d={IC.send} size={14} color="#071a0e"/>}>Send</Btn></div></div>);}

function Forum({tenant,unit}){const INIT=[{id:1,author:"Marcus T.",unit:"201",time:"2h ago",title:"Laundry room schedule",body:"Hey neighbors, can we coordinate laundry times? I suggest floors 1 & 2 mornings, floor 3 evenings.",replies:[{author:"Priya K.",unit:"301",text:"Works for me!",time:"1h ago"}],likes:4},{id:2,author:"Sandra L.",unit:"102",time:"1d ago",title:"Package room access",body:"The package room code was changed. New code from the manager is 4821.",replies:[],likes:2}];const [forums,setForums]=useState(()=>load("cg_forum",INIT));const [view,setView]=useState(null);const [showNew,setShowNew]=useState(false);const [newTitle,setNewTitle]=useState("");const [newBody,setNewBody]=useState("");const [reply,setReply]=useState("");useEffect(()=>{save("cg_forum",forums);},[forums]);const post=forums.find(p=>p.id===view);const addPost=()=>{if(!newTitle.trim()||!newBody.trim())return;const a=`${tenant.firstName} ${tenant.lastName[0]}.`;setForums(f=>[{id:Date.now(),author:a,unit,time:"Just now",title:newTitle,body:newBody,replies:[],likes:0},...f]);setNewTitle("");setNewBody("");setShowNew(false);};const addReply=()=>{if(!reply.trim())return;const a=`${tenant.firstName} ${tenant.lastName[0]}.`;setForums(f=>f.map(p=>p.id===view?{...p,replies:[...p.replies,{author:a,unit,text:reply,time:"Just now"}]}:p));setReply("");};if(post)return(<div style={{display:"flex",flexDirection:"column",gap:14}}><button onClick={()=>setView(null)} style={{display:"flex",alignItems:"center",gap:6,background:"none",border:"none",color:T.green,cursor:"pointer",fontSize:13,fontWeight:700,padding:0}}><Icon d={IC.back} size={16} color={T.green}/> Back to Forum</button><Card><div style={{fontFamily:T.serif,fontSize:20,fontWeight:900,color:T.text,marginBottom:8}}>{post.title}</div><div style={{fontSize:12,color:T.muted,marginBottom:14}}>{post.author} · Unit {post.unit} · {post.time}</div><div style={{fontSize:14,color:T.text,lineHeight:1.75}}>{post.body}</div></Card><div style={{fontSize:11,color:T.muted,fontWeight:700,letterSpacing:"0.1em"}}>REPLIES ({post.replies.length})</div>{post.replies.map((r,i)=><Card key={i} style={{padding:14}}><div style={{fontSize:11,color:T.green,fontWeight:700,marginBottom:4}}>{r.author} · Unit {r.unit} · {r.time}</div><div style={{fontSize:14,color:T.text}}>{r.text}</div></Card>)}<div style={{display:"flex",gap:10}}><Input value={reply} onChange={setReply} placeholder="Write a reply…" style={{flex:1}}/><Btn onClick={addReply} disabled={!reply.trim()} small icon={<Icon d={IC.send} size={13} color="#071a0e"/>}>Reply</Btn></div></div>);return(<div style={{display:"flex",flexDirection:"column",gap:14}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><div style={{fontFamily:T.serif,fontSize:24,fontWeight:900,color:T.text}}>Forum</div><Btn onClick={()=>setShowNew(!showNew)} small variant="green">New Post</Btn></div><Card style={{padding:"12px 16px"}}><div style={{fontSize:11,color:T.muted,fontWeight:700,letterSpacing:"0.1em",marginBottom:8}}>33 COTTAGE ST — ALL UNITS</div><div style={{display:"flex",flexWrap:"wrap",gap:6}}>{UNITS.map(u=><span key={u} style={{padding:"4px 12px",borderRadius:20,background:u===unit?T.green:T.greenDim,border:`1px solid ${T.green}33`,fontSize:12,fontWeight:700,color:u===unit?"#071a0e":T.green}}>{u===unit?`${u} (You)`:u}</span>)}</div></Card>{showNew&&<Card><div style={{fontSize:11,color:T.muted,fontWeight:700,letterSpacing:"0.1em",marginBottom:12}}>NEW POST — Unit {unit}</div><div style={{display:"flex",flexDirection:"column",gap:10}}><Input value={newTitle} onChange={setNewTitle} placeholder="Post title"/><Input value={newBody} onChange={setNewBody} placeholder="What's on your mind?" multiline/><div style={{display:"flex",gap:8}}><Btn onClick={addPost} disabled={!newTitle.trim()||!newBody.trim()} small>Post</Btn><Btn onClick={()=>setShowNew(false)} small variant="ghost">Cancel</Btn></div></div></Card>}{forums.map(p=><Card key={p.id} onClick={()=>setView(p.id)} style= if(showManagerLogin)return <ManagerLogin onSuccess={()=>{setShowManagerLogin(false);setShowManager(true);}} onBack={()=>setShowManagerLogin(false)}/>;
const tabs=[{id:"home",label:"Home",icon:IC.home},{id:"pay",label:"Pay",icon:IC.pay},{id:"messages",label:"Messages",icon:IC.msg},{id:"forum",label:"Forum",icon:IC.forum},{id:"lease",label:"Lease",icon:IC.doc}];
const screens={home:<Dashboard setTab={setTab} tenant={tenant} unit={selectedUnit}/>,pay:<PayRent unit={selectedUnit} tenant={tenant}/>,messages:<Messages tenant={tenant} unit={selectedUnit}/>,forum:<Forum tenant={tenant} unit={selectedUnit}/>,lease:<LeaseScreen unit={selectedUnit} tenant={tenant}/>};
return(<div style={{minHeight:"100vh",background:T.bg,color:T.text}}>{!splashDone&&<Splash onDone={()=>setSplashDone(true)}/>}{splashDone&&!selectedUnit&&<UnitSelect tenantProfiles={tenantProfiles} onSelect={handleUnitSelect} onManagerTap={()=>setShowManagerLogin(true)}/>}{splashDone&&selectedUnit&&!pinVerified&&<PinScreen unit={selectedUnit} onSuccess={handlePinSuccess} onBack={()=>setSelectedUnit(null)}/>}{splashDone&&selectedUnit&&pinVerified&&showSetup&&<TenantSetup unit={selectedUnit} existing={tenantProfiles[selectedUnit]} onSave={handleProfileSave} onBack={handleBack}/>}{splashDone&&isInApp&&(<><div style={{position:"sticky",top:0,zIndex:10,background:T.bg+"f0",backdropFilter:"blur(14px)",borderBottom:`1px solid ${T.border}`,padding:"12px 18px",display:"flex",justifyContent:"space-between",alignItems:"center"}}><div style={{display:"flex",alignItems:"center",gap:10}}><CGMark size={32}/><div><CGWordmark size={17}/><div style={{fontSize:10,color:T.muted,letterSpacing:"0.06em"}}>33 Cottage St · Unit {selectedUnit}</div></div></div><div style={{display:"flex",alignItems:"center",gap:8}}><button onClick={()=>setShowSetup(true)} style={{background:"none",border:"none",cursor:"pointer",padding:0}}><div style={{width:38,height:38,borderRadius:"50%",background:`linear-gradient(135deg,${T.green},#2aaa72)`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,fontWeight:900,color:"#071a0e",fontFamily:T.serif}}>{initials(`${tenant.firstName} ${tenant.lastName}`)}</div></button><button onClick={handleSwitchUnit} style={{background:T.faint,border:`1px solid ${T.border}`,borderRadius:8,padding:"5px 9px",cursor:"pointer",fontSize:10,fontWeight:700,color:T.muted}}>Switch</button></div></div><div style={{maxWidth:480,margin:"0 auto",padding:"20px 16px 90px"}}>{screens[tab]}</div><div style={{position:"fixed",bottom:0,left:0,right:0,background:T.surface+"f8",backdropFilter:"blur(18px)",borderTop:`1px solid ${T.border}`,display:"flex",justifyContent:"space-around",padding:"10px 0 max(10px,env(safe-area-inset-bottom))",zIndex:20}}>{tabs.map(t=>{const active=tab===t.id;return(<button key={t.id} onClick={()=>setTab(t.id)} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4,background:"none",border:"none",cursor:"pointer",padding:"4px 12px",color:active?T.green:T.muted,transition:"color 0.18s",position:"relative"}}>{active&&<div style={{position:"absolute",top:-10,left:"50%",transform:"translateX(-50%)",width:32,height:2,borderRadius:2,background:T.green}}/>}<Icon d={t.icon} size={20} color={active?T.green:T.muted}/><span style={{fontSize:10,fontWeight:700}}>{t.label}</span></button>);})}</div></>)}</div>);}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
