  {id:1,cat:"1031",author:"James K.",avatar:"JK",location:"Rutland, VT 05701",time:"2h ago",title:"Successfully closed my first 1031 — here's what I learned",body:"Just wrapped a 1031 exchange from my Springfield 6-unit into a 10-unit in Leominster. The 45-day window nearly killed me — started looking for replacement properties the day I listed. Key lesson: have 3 backups identified before you close on the relinquished property. Happy to answer questions.",likes:24,replies:[{author:"Maria S.",avatar:"MS",time:"1h ago",text:"This is gold. Did you use IPX1031 as your QI? I'm starting the process now and CommonGround's integration was super helpful for pre-filling the paperwork."},{author:"James K.",avatar:"JK",time:"45m ago",text:"Yes, IPX1031 was great. Fast wire transfers, clear communication. The identification letter template CommonGround generates saved me 2 hours of back-and-forth with my attorney."}]},
  {id:2,cat:"financing",author:"Angela R.",avatar:"AR",location:"Northampton, MA",time:"5h ago",title:"DSCR loans vs conventional — what are you all using for 2025 acquisitions?",body:"Rates are still brutal. I've been using DSCR loans (debt service coverage ratio) for my last 3 acquisitions. No personal income verification, just the property's cash flow. Current rates around 7.5% but the flexibility is worth it. Anyone else going this route?",likes:18,replies:[{author:"Robert N.",avatar:"RN",time:"4h ago",text:"DSCR all the way. Used Kiavi for my last two deals — closed in 21 days. Portfolio lenders are also worth a look if you have 5+ units."},{author:"Patricia O.",avatar:"PO",time:"3h ago",text:"I've had good luck with local credit unions. They'll sometimes do portfolio loans at slightly better rates if you have a relationship with them. Worth a conversation."}]},
  {id:3,cat:"legal",author:"David C.",avatar:"DC",location:"Springfield, MA",time:"1d ago",title:"MA security deposit law update — are you compliant?",body:"Heads up for MA landlords: the AG's office has been cracking down on security deposit violations. Make sure you're: (1) putting deposits in a separate interest-bearing account, (2) providing itemized receipts within 30 days of move-out, (3) not charging more than 1 month's rent. Saw a landlord hit with a 3x penalty last month.",likes:41,replies:[{author:"Angela R.",avatar:"AR",time:"23h ago",text:"Thanks for the reminder. We use CommonGround's ledger to track deposits separately. The automatic year-end reconciliation makes audit prep so much easier."},{author:"David C.",avatar:"DC",time:"22h ago",text:"Exactly — the paper trail is everything. The AG looks for systematic violations, not honest mistakes. Document everything."}]},
  {id:4,cat:"maintenance",author:"Patricia O.",avatar:"PO",location:"Lowell, MA",time:"2d ago",title:"Preventive maintenance schedule that cut my repair costs 30%",body:"After my hot water heater nightmare last winter ($3,400 emergency replacement), I built a full preventive maintenance calendar. Annual HVAC service, biannual plumbing inspections, quarterly gutter cleaning. Year 1 cost me $2,200 in scheduled maintenance. Saved $4,600 in avoided repairs. Worth every penny.",likes:35,replies:[{author:"James K.",avatar:"JK",time:"2d ago",text:"Would you share the calendar? This is exactly what I need. I've been reactive with maintenance and it's killing my NOI."},{author:"Patricia O.",avatar:"PO",time:"2d ago",text:"Happy to post it in the resource section. The key is scheduling with the same vendors every year — they'll give you preferred pricing if you're a reliable customer."}]},
  {id:5,cat:"market",author:"Robert N.",avatar:"RN",location:"Leominster, MA",time:"3d ago",title:"Worcester rental market — rents finally softening?",body:"Seeing the first signs of softening in Worcester. Had a 2BR sit for 3 weeks — first time in 2 years. New construction downtown is adding inventory. Still strong fundamentals but I'm being more careful about rent increases on renewals. Anyone else noticing this?",likes:12,replies:[{author:"David C.",avatar:"DC",time:"3d ago",text:"Springfield has been soft for a while. Class A buildings are taking tenants from older stock. I've been doing 3% increases instead of 5% to keep good tenants. Retention > vacancy."},{author:"Angela R.",avatar:"AR",time:"3d ago",text:"Northampton is still tight. University town effect. But agree that over-pushing rents is short-sighted in any market right now."}]},

function App(){
  // Vendor portal routing
  const urlParams=new URLSearchParams(window.location.search);
  const vendorWoId=urlParams.get("vendor");
  const[screen,setScreen]=useState("landing");
  const[fees,setFees]=useState(DEFAULT_FEES);
  useEffect(()=>{fbRead("cg_fees").then(v=>{if(v)setFees({...DEFAULT_FEES,...v});});},[]);
  const updateFees=async(nf)=>{const m={...fees,...nf};setFees(m);await fbWrite("cg_fees",m);};
  const[selectedUnit,setSelectedUnit]=useState(null);
  const[selectedPropId,setSelectedPropId]=useState("cottage");
  const[workOrders,setWorkOrders]=useState(INITIAL_WORK_ORDERS);
  const[tenantInboxes,setTenantInboxes]=useState(TENANT_INBOXES);
  const[reminders,setReminders]=useState(INITIAL_REMINDERS);
  const[sharedDocs,setSharedDocs]=useState([]);
  const[applications,setApplications]=useState([]);
  const[tenantSignedDocs,setTenantSignedDocs]=useState({});
  const[pendingSigAlert,setPendingSigAlert]=useState(null);

  const onTenantSign=(docId,docName,unit,propId,sigData)=>{
    setTenantSignedDocs(prev=>({...prev,[docId]:sigData}));
    setPendingSigAlert({docId,docName,unit,propId,sigData});
    setTimeout(()=>{setScreen("manager");},1800);
  };

  const refreshState=useCallback(async()=>{
    try{
      const res=await fetch(API.state,{cache:"no-store"});
      const data=await res.json();
      if(!data.ok||!data.workOrders)return;
      const mapped=data.workOrders.map(wo=>({id:wo.workOrderId,workOrderId:wo.workOrderId,propId:wo.propertyId||"cottage",propertyId:wo.propertyId||"cottage",propertyName:wo.propertyName||"33 Cottage St",unit:wo.unit,title:wo.issue||"Maintenance request",cat:wo.category||"general",category:wo.category||"general",priority:wo.priority||"medium",status:wo.status||"open",desc:wo.issue||"",issue:wo.issue||"",date:wo.submittedAt?new Date(wo.submittedAt).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}):"Today",submittedAt:wo.submittedAt,assignee:wo.vendorName||"",vendorName:wo.vendorName||"",vendorPhone:wo.vendorPhone||"",notes:wo.vendorReply||"",eta:wo.eta||null,tenantMessage:wo.tenantMessage||"",twilioEnabled:!!wo.twilioEnabled}));
      setWorkOrders(mapped);
      data.workOrders.forEach(wo=>{if(wo.tenantMessage&&wo.vendorReplyAt){const msgId="vr-"+wo.workOrderId;setTenantInboxes(prev=>{const inbox=prev[wo.unit]||[];if(inbox.some(m=>m.id===msgId))return prev;return{...prev,[wo.unit]:[...inbox,{id:msgId,from:"manager",text:wo.tenantMessage,time:new Date(wo.vendorReplyAt).toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"})}]};});}});
    }catch(e){console.error("refreshState error",e);}
  },[]);

  useEffect(()=>{refreshState();const interval=setInterval(refreshState,8000);return()=>clearInterval(interval);},[]);

  const sharedProps={workOrders,setWorkOrders,tenantInboxes,setTenantInboxes,sharedDocs,setSharedDocs,refreshState};
  if(vendorWoId){return React.createElement(VendorPortal,{woId:vendorWoId,workOrders:workOrders});}
  if(screen==="splash")return React.createElement(Splash,{onDone:()=>setScreen("landing")});
  if(screen==="landing")return React.createElement(Landing,{onExplore:()=>setScreen("units"),onManager:()=>setScreen("manager"),onApply:()=>setScreen("apply"),onMarket:()=>setScreen("marketplace")});
  if(screen==="forum")return React.createElement(LandlordForum,{onBack:()=>setScreen("landing")});
  if(screen==="marketplace")return React.createElement(Marketplace,{onBack:(tab)=>{if(tab==="exchange"){setScreen("manager");}else{setScreen("landing");}}});
  if(screen==="apply")return React.createElement(TenantApplication,{onBack:()=>setScreen("landing"),onSubmit:(app)=>setApplications(prev=>[...prev,app])});
  if(screen==="units")return React.createElement(UnitSelect,{onSelect:(propId,unit)=>{setSelectedPropId(propId);setSelectedUnit(unit);setScreen("tenant");},onManagerDemo:()=>setScreen("manager")});
  if(screen==="tenant"&&selectedUnit)return React.createElement(TenantApp,{unit:selectedUnit,propId:selectedPropId,onBack:()=>setScreen("units"),tenantSignedDocs,onTenantSign,fees,...sharedProps});
  if(screen==="manager")return React.createElement(ManagerDemo,{onBack:()=>setScreen("landing"),reminders,setReminders,applications,setApplications,pendingSigAlert,setPendingSigAlert,fees,updateFees,...sharedProps});
  return null;
}
